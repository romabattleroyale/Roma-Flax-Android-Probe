name: Experimental Flax Android ARM64 build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Flax game target for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout probe repository
        uses: actions/checkout@v4

      - name: Install Linux editor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs libglib2.0-dev libwayland-dev wayland-protocols libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev
          git lfs install

      - name: Checkout Flax Engine source
        uses: actions/checkout@v4
        with:
          repository: FlaxEngine/FlaxEngine
          ref: master
          path: FlaxEngine
          lfs: true
          submodules: recursive

      - name: Set up .NET SDK used by current Flax CI
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true

      - name: Checkout Flax sample project
        uses: actions/checkout@v4
        with:
          repository: FlaxEngine/FlaxSamples
          ref: master
          path: FlaxSamples

      - name: Configure sample project for Android packaging
        run: |
          cp "FlaxEngine/.github/data/Build Settings.json" "FlaxSamples/BasicTemplate/Content/Settings/Build Settings.json"
          cp "FlaxEngine/.github/data/ExitOnEsc.cs" "FlaxSamples/BasicTemplate/Source/Game/ExitOnEsc.cs"

      - name: Verify Android SDK and NDK detection
        working-directory: FlaxEngine
        run: |
          ./Development/Scripts/Linux/CallBuildTool.sh -log -printSDKs -dotnet=10

      - name: Build Flax editor for headless game cooking
        working-directory: FlaxEngine
        run: |
          ./Development/Scripts/Linux/CallBuildTool.sh -build -log -printSDKs -dotnet=10 -arch=x64 -platform=Linux -configuration=Development -buildtargets=FlaxEditor

      - name: Cook and package sample game as Android APK
        working-directory: FlaxEngine
        run: |
          ./Binaries/Editor/Linux/Development/FlaxEditor -std -headless -mute -null -project "../FlaxSamples/BasicTemplate" -build "Development.Android"

      - name: Locate packaged Android APK
        if: always()
        run: |
          echo "Searching for generated APK files..."
          find FlaxSamples/BasicTemplate -type f -name "*.apk" -print || true
          echo "Build output directories:"
          find FlaxSamples/BasicTemplate -maxdepth 4 -type d -iname "*android*" -print || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flax-android-arm64-apk
          path: FlaxSamples/BasicTemplate/**/*.apk
          if-no-files-found: error
