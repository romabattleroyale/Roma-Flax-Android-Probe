name: Flax Android toolchain probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    name: Check Android build tools
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout probe repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
      - name: Install Android platform and NDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install .NET Android workload
        run: dotnet workload install android
      - name: Report installed toolchain
        run: |
          java -version
          dotnet --info
          sdkmanager --list_installed
          ls "$ANDROID_SDK_ROOT/ndk"
          echo "Toolchain check complete; this is not a Flax build or APK."
