name: QuickQuote static checks

on:
  push:
    branches: [quickquote-web-v1]
    paths:
      - 'quickquote-site/**'
      - '.github/workflows/quickquote-check.yml'
  pull_request:
    branches: [quickquote-web-v1]
    paths:
      - 'quickquote-site/**'
      - '.github/workflows/quickquote-check.yml'

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check manifest JSON and required files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('quickquote-site')
          required = [
              'index.html', 'app.html', 'auth.html', 'workspace.html',
              'manifest.webmanifest', 'icon.svg', 'sw.js',
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit('Missing files: ' + ', '.join(missing))
          manifest = json.loads((root / 'manifest.webmanifest').read_text(encoding='utf-8'))
          for key in ('name', 'short_name', 'start_url', 'display', 'icons'):
              if key not in manifest:
                  raise SystemExit('Manifest missing key: ' + key)
          print('Required files and manifest JSON: OK')
          PY
      - name: Check local links referenced by main pages
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          root = Path('quickquote-site')
          pages = ['index.html', 'app.html', 'auth.html', 'workspace.html']
          errors = []
          for page in pages:
              text = (root / page).read_text(encoding='utf-8')
              for target in re.findall(r'''(?:href|src)=[\"'](\./[^#\"']+)[\"']''', text):
                  path = target.split('?', 1)[0]
                  if path.startswith('./') and not (root / path[2:]).exists():
                      errors.append(f'{page}: missing local target {target}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('Local relative links: OK')
          PY
      - name: Check PWA wiring and avoid accidental cross-app cache deletion
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('quickquote-site/app.html').read_text(encoding='utf-8')
          worker = Path('quickquote-site/sw.js').read_text(encoding='utf-8')
          errors = []
          if 'rel="manifest"' not in app or './manifest.webmanifest' not in app:
              errors.append('app.html does not link the web app manifest')
          if "serviceWorker.register('./sw.js')" not in app:
              errors.append('app.html does not register the service worker')
          if "key.startsWith('quickquote-static-')" not in worker:
              errors.append('service worker cleanup is not restricted to QuickQuote caches')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('PWA wiring and cache isolation: OK')
          PY
      - name: Check database plan protection and row-level security
        run: |
          python - <<'PY'
          from pathlib import Path
          sql = Path('quickquote-site/supabase/schema.sql').read_text(encoding='utf-8').lower()
          required = [
              'create or replace function public.guard_profile_plan()',
              'create trigger profiles_guard_plan before insert or update on public.profiles',
              "new.plan is distinct from old.plan",
              'alter table public.profiles enable row level security',
              'alter table public.customers enable row level security',
              'alter table public.quotes enable row level security',
              'alter table public.quote_items enable row level security',
          ]
          missing = [item for item in required if item not in sql]
          if missing:
              raise SystemExit('Missing schema safeguards: ' + '; '.join(missing))
          print('Schema safeguards present: OK')
          PY
      - name: Check Incassi draft has essential safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          sql_path = Path('quickquote-site/supabase/incassi_schema_draft.sql')
          checklist = Path('docs/IMPRESAFLOW_INCASSI_TEST_CHECKLIST.md')
          workflows = Path('docs/IMPRESAFLOW_SERVER_WORKFLOWS.md')
          if not sql_path.is_file() or not checklist.is_file() or not workflows.is_file():
              raise SystemExit('Missing Incassi draft or supporting security docs')
          sql = sql_path.read_text(encoding='utf-8').lower()
          required = [
              'alter table public.incassi_invoices enable row level security',
              'alter table public.incassi_payments enable row level security',
              'alter table public.incassi_reminders enable row level security',
              'alter table public.incassi_payment_plans enable row level security',
              'alter table public.incassi_installments enable row level security',
              'alter table public.incassi_activity_events enable row level security',
              'create trigger incassi_payments_guard_verification',
              'create trigger incassi_reminders_guard_approval',
              'create trigger incassi_plans_guard_acceptance',
              "new.verification_status <> 'pending'",
              "new.status <> 'draft'",
          ]
          missing = [item for item in required if item not in sql]
          if missing:
              raise SystemExit('Missing Incassi safeguards: ' + '; '.join(missing))
          # Catch malformed dollar-quoted PL/pgSQL blocks in this draft.
          if 'returns trigger language plpgsql as $\nbegin' in sql:
              raise SystemExit('Malformed PL/pgSQL dollar quote in Incassi draft')
          if sql.count('$') % 2:
              raise SystemExit('Unbalanced PL/pgSQL dollar quotes in Incassi draft')
          if 'incassi_guard_installment_payment' not in sql:
              raise SystemExit('Missing guard against client-side installment payment state changes')
          install_path = Path('quickquote-site/supabase/impresaflow_initial_install_review.sql')
          if not install_path.is_file():
              raise SystemExit('Missing combined install review candidate')
          install_sql = install_path.read_text(encoding='utf-8').lower()
          if 'new, empty supabase project only' not in install_sql:
              raise SystemExit('Combined install candidate must warn against existing databases')
          if install_sql.count('$') % 2:
              raise SystemExit('Unbalanced dollar-quoted blocks in combined install candidate')
          if 'returns trigger language plpgsql as $\\nbegin' in install_sql:
              raise SystemExit('Malformed PL/pgSQL dollar quote in combined install candidate')
          for table in ('public.customers', 'public.incassi_invoices', 'public.incassi_payments'):
              if table not in install_sql:
                  raise SystemExit('Combined install candidate missing dependency: ' + table)
          print('Incassi safeguards and SQL delimiter checks: OK (static only; no SQL execution or security test)')
          PY
