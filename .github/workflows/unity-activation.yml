name: Unity Personal License Activation Request

on:
  push:
    paths:
      - ".github/workflows/unity-activation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation:
    name: Generate Unity activation file on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Generate activation request for Unity 6
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.0f1
      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: unity-personal-activation-request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
